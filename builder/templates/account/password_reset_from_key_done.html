{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block main %}
<div class="container py-4 py-md-5">
  <div class="auth-card mx-auto text-center">
    <i class="bi bi-check-circle-fill text-success" style="font-size:56px"></i>
    <h1 class="h3 mb-2">Password changed</h1>
    <div class="alert alert-success py-2" role="status">Your new password is saved. Log in with it now.</div>
    <a class="btn btn-brand btn-lg w-100" href="{% url 'account_login' %}">Log in</a>
  </div>
</div>
{% endblock %}
