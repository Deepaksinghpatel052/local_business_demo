# The host port comes from DOCKER_PORT in .env (Docker Compose reads .env automatically).
services:
  demos:
    build: .
    image: local-business-demos
    container_name: local-business-demos
    ports:
      - "${DOCKER_PORT:-8080}:80"
    volumes:
      - ./demos:/usr/share/nginx/demos:ro   # live: edits to demos/ show on refresh
    restart: unless-stopped
