# Every value comes from .env (Docker Compose reads it automatically): nothing is set here.
#   DOCKER_PORT          static demos + showcase (Nginx)
#   APP_DOCKER_PORT      Django site builder (builder/); the builder also reads all of .env itself
#   DOCKER_DATABASE_URL, DOCKER_SITES_ROOT, DOCKER_MEDIA_ROOT, DOCKER_LOG_DIR
#                        where the builder keeps its data inside the container (volume builder-data)
# After changing .env:  docker compose up -d
services:
  demos:
    build: .
    image: local-business-demos
    container_name: local-business-demos
    ports:
      - "${DOCKER_PORT:?Set DOCKER_PORT in .env}:80"
    volumes:
      - ./demos:/usr/share/nginx/demos:ro   # live: edits to demos/ show on refresh
      - ./showcase:/usr/share/nginx/showcase:ro
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: local-business-builder
    container_name: local-business-builder
    ports:
      - "${APP_DOCKER_PORT:?Set APP_DOCKER_PORT in .env}:8000"
    volumes:
      - .:/app                              # live code + .env: edits show after a refresh / restart
      - builder-data:/data                  # database, uploads, published sites
    environment:
      # Container folders differ from the ones on your PC, so .env keeps them under DOCKER_* names
      DATABASE_URL: "${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}"
      SITES_ROOT: "${DOCKER_SITES_ROOT:?Set DOCKER_SITES_ROOT in .env}"
      MEDIA_ROOT: "${DOCKER_MEDIA_ROOT:?Set DOCKER_MEDIA_ROOT in .env}"
      LOG_DIR: "${DOCKER_LOG_DIR:?Set DOCKER_LOG_DIR in .env}"
    restart: unless-stopped

volumes:
  builder-data:
