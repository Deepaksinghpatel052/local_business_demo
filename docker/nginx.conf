# Local Docker preview of every demo (mirrors deploy/nginx-wildcard.conf).
#   http://<slug>.localhost:<DOCKER_PORT>/   subdomain style, same as production
#   http://localhost:<DOCKER_PORT>/          Devnixplus showcase: grid of every demo
#   http://localhost:<DOCKER_PORT>/<slug>/   path style, works in any browser
# DOCKER_PORT is set in .env (default 8080). Inside the container Nginx always listens on 80.
# Demo folders live in /usr/share/nginx/demos/<slug>/.

# Subdomains: <slug>.localhost -> /usr/share/nginx/demos/<slug>
server {
    listen 80;
    server_name ~^(?<sub>[a-z0-9-]+)\.localhost$;
    root /usr/share/nginx/demos/$sub;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /data.js { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location / { try_files $uri $uri/ =404; }
}

# localhost: Devnixplus showcase (showcase/) at / + each demo under /<slug>/
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/demos;
    index index.html;
    absolute_redirect off;              # keep the host port when adding the trailing slash

    add_header X-Robots-Tag "noindex, nofollow" always;
    location ~ /data\.js$ { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
    # Showcase page and its files (showcase/index.html, demos.js, thumbs/)
    location = / { root /usr/share/nginx/showcase; try_files /index.html =404; }
    location = /demos.js { root /usr/share/nginx/showcase; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /config.js { root /usr/share/nginx/showcase; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location /thumbs/ { root /usr/share/nginx/showcase; }
    location / { try_files $uri $uri/ =404; }
}
