# Local Docker preview of every demo (mirrors deploy/nginx-wildcard.conf).
#   http://<slug>.localhost:<DOCKER_PORT>/   subdomain style, same as production
#   http://localhost:<DOCKER_PORT>/<slug>/   path style, works in any browser
# DOCKER_PORT is set in .env (default 8080). Inside the container Nginx always listens on 80.
# Demo folders live in /usr/share/nginx/demos/<slug>/.

# Subdomains: <slug>.localhost -> /usr/share/nginx/demos/<slug>
server {
    listen 80;
    server_name ~^(?<sub>[a-z0-9-]+)\.localhost$;
    root /usr/share/nginx/demos/$sub;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /data.js { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location / { try_files $uri $uri/ =404; }
}

# localhost: list of demos + each demo under /<slug>/
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/demos;
    index index.html;
    absolute_redirect off;              # keep the host port when adding the trailing slash

    add_header X-Robots-Tag "noindex, nofollow" always;
    location ~ /data\.js$ { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = / { autoindex on; }
    location / { try_files $uri $uri/ =404; }
}
