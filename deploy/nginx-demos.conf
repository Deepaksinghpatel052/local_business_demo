# =============================================================================
# demo.devnixplus.com: previews and hosted sites as static files (Django not needed).
#
#   DEMO_URL_STYLE=path       https://demo.devnixplus.com/<slug>/       (block A, the default)
#   DEMO_URL_STYLE=subdomain  https://<slug>.demo.devnixplus.com/       (block B; wildcard DNS + wildcard cert)
#
# Folder layout (SITES_ROOT=/var/www/demos), shared by hand-made demos and platform sites:
#   /var/www/demos/<slug>/index.html, data.js, images/   platform site (uses /_shared/)
#   /var/www/demos/<demo>/index.html, css/, js/, …        existing self-contained demos (unchanged)
#   /var/www/demos/_shared/v1/css|js|placeholders          shared template assets (manage.py sync_shared)
#   /var/www/demos/.tmp-* / .old-*                         short-lived publish folders (never served)
#
# No X-Robots-Tag here on purpose: live sites must be indexable. Previews and hand-made demos carry
# <meta name="robots" content="noindex, nofollow"> in their own index.html.
#
#   sudo cp deploy/nginx-demos.conf /etc/nginx/sites-available/devnix-demos.conf
#   sudo ln -s /etc/nginx/sites-available/devnix-demos.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ---------------------------------------------------------------------------
# A) PATH STYLE: demo.devnixplus.com/<slug>/
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name demo.devnixplus.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://demo.devnixplus.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.devnixplus.com;
    ssl_certificate     /etc/letsencrypt/live/demo.devnixplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.devnixplus.com/privkey.pem;

    root /var/www/demos;
    index index.html;
    absolute_redirect off;

    location ~ /\. { deny all; }                       # .tmp-* / .old-* publish folders, dotfiles
    location /_shared/ { alias /var/www/demos/_shared/; expires 30d; access_log off; }
    location = / { root /var/www/showcase; try_files /index.html =404; }   # the showcase grid (showcase/)
    location = /demos.js { root /var/www/showcase; expires -1; }
    location /thumbs/ { root /var/www/showcase; expires 7d; }
    location ~ /data\.js$ { expires -1; }              # changes on every save
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|css|js|woff2?)$ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
}

