# =============================================================================
# demo.devnixplus.com: previews and hosted sites as static files (Django not needed).
#
#   DEMO_URL_STYLE=path       https://demo.devnixplus.com/<slug>/       (block A, the default)
#   DEMO_URL_STYLE=subdomain  https://<slug>.demo.devnixplus.com/       (block B; wildcard DNS + wildcard cert)
#
# Folders (Nginx on the server reads them directly; the builder container writes them through MEDIA_DIR):
#   /srv/local_business_demo/media/sites/<slug>/        platform site: index.html, data.js, images/ (uses /_shared/)
#   /srv/local_business_demo/media/sites/_shared/v1/    shared template assets (manage.py sync_shared)
#   /srv/local_business_demo/media/sites/.tmp-*, .old-* short-lived publish folders (never served)
#   /srv/local_business_demo/demos/<demo>/              hand-made demos from git (used when no platform site has that name)
#   /srv/local_business_demo/showcase/                  the showcase grid at /
# Using another MEDIA_DIR or project folder? Replace those paths below.
#
# No X-Robots-Tag here on purpose: live sites must be indexable. Previews and hand-made demos carry
# <meta name="robots" content="noindex, nofollow"> in their own index.html.
#
#   sudo cp deploy/nginx-demos.conf /etc/nginx/sites-available/devnix-demos.conf
#   sudo ln -s /etc/nginx/sites-available/devnix-demos.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ---------------------------------------------------------------------------
# A) PATH STYLE: demo.devnixplus.com/<slug>/
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name demo.devnixplus.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://demo.devnixplus.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.devnixplus.com;
    ssl_certificate     /etc/letsencrypt/live/demo.devnixplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.devnixplus.com/privkey.pem;

    root /srv/local_business_demo/media/sites;                 # platform sites first, then the hand-made demos (@demos)
    index index.html;
    absolute_redirect off;

    location ~ /\. { deny all; }                       # .tmp-* / .old-* publish folders, dotfiles
    location /_shared/ { alias /srv/local_business_demo/media/sites/_shared/; expires 30d; access_log off; }
    location = / { root /srv/local_business_demo/showcase; try_files /index.html =404; }   # the showcase grid (showcase/)
    location = /demos.js { root /srv/local_business_demo/showcase; expires -1; }
    location = /config.js { root /srv/local_business_demo/showcase; expires -1; }     # manage.py write_showcase_config
    location /thumbs/ { root /srv/local_business_demo/showcase; expires 7d; }
    location ~ /data\.js$ { expires -1; try_files $uri @demos; }      # changes on every save
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|css|js|woff2?)$ { expires 7d; try_files $uri @demos; }
    location / { try_files $uri $uri/ @demos; }
    location @demos { root /srv/local_business_demo/demos; try_files $uri $uri/ =404; }

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
}

