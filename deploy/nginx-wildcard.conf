# =============================================================================
# nginx-wildcard.conf: one config serves EVERY demo as its own subdomain.
#
#   https://sharma-sweets.mydomain.com/  ->  /var/www/demos/sharma-sweets/index.html
#
# Install (Ubuntu/Debian):
#   sudo cp nginx-wildcard.conf /etc/nginx/sites-available/demos.conf
#   (replace every "mydomain.com" and "mydomain\.com" with your domain)
#   sudo ln -s /etc/nginx/sites-available/demos.conf /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/demos /var/www/main
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS:  A  @  -> SERVER_IP      A  *  -> SERVER_IP      (and A www -> SERVER_IP)
# SSL:  wildcard certificate for mydomain.com + *.mydomain.com via Certbot DNS
#       challenge (see README.md, "Wildcard SSL").
#
# After this is set up once, deploying a demo is only:
#   scp -r demos/<slug> user@server:/var/www/demos/
# No new config, no port, no .env, no Nginx reload.
# =============================================================================


# -----------------------------------------------------------------------------
# 1) MAIN SITE + www: explicit server_name blocks. Exact names always win over
#    the regex below, so mydomain.com and www are never caught by the wildcard.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mydomain.com www.mydomain.com;
    return 301 https://mydomain.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                   # nginx < 1.25.1: use "listen 443 ssl http2;" instead
    server_name www.mydomain.com;
    ssl_certificate     /etc/letsencrypt/live/mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydomain.com/privkey.pem;
    return 301 https://mydomain.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mydomain.com;
    ssl_certificate     /etc/letsencrypt/live/mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydomain.com/privkey.pem;

    root /var/www/main;                         # your own portfolio / agency site
    index index.html;
    location / { try_files $uri $uri/ =404; }
}


# -----------------------------------------------------------------------------
# 2) DEMOS over HTTP -> redirect every subdomain to HTTPS
#
#    (Before you have the SSL certificate, you can temporarily use this simple
#     version instead of blocks 2 + 3:
#
#       server {
#           listen 80;
#           server_name ~^(?<sub>[a-z0-9-]+)\.mydomain\.com$;
#           root /var/www/demos/$sub;
#           index index.html;
#           location / { try_files $uri $uri/ =404; }
#       }
#    )
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<sub>[a-z0-9-]+)\.mydomain\.com$;
    return 301 https://$host$request_uri;
}


# -----------------------------------------------------------------------------
# 3) DEMOS over HTTPS: the subdomain picks the folder automatically
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Only letters, digits and "-" are captured, so "$sub" can never contain
    # "/" or "..": the root always stays inside /var/www/demos.
    server_name ~^(?<sub>[a-z0-9-]+)\.mydomain\.com$;

    ssl_certificate     /etc/letsencrypt/live/mydomain.com/fullchain.pem;   # wildcard cert
    ssl_certificate_key /etc/letsencrypt/live/mydomain.com/privkey.pem;

    root /var/www/demos/$sub;
    index index.html;

    # Demo concepts must not show up on Google before the owner approves.
    # (index.html also has <meta name="robots" content="noindex, nofollow">.)
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static files for a week. ("expires" sets its own header, so the
    # X-Robots-Tag above is still inherited by this location.)
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|css|js|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # data.js changes often while you edit a demo: always revalidate it
    location = /data.js {
        expires -1;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
}


