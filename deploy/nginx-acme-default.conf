# =============================================================================
# Default port-80 server: answers Let's Encrypt HTTP challenges for ANY domain pointed at
# this server, so a customer domain can get its certificate before its own server block exists.
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx-acme-default.conf /etc/nginx/sites-available/00-acme-default.conf
#   sudo ln -s /etc/nginx/sites-available/00-acme-default.conf /etc/nginx/sites-enabled/
#   (remove /etc/nginx/sites-enabled/default if it also says default_server)
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
