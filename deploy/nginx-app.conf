# =============================================================================
# app.devnixplus.com -> Django (Gunicorn): signup, dashboard, editor, payments, /manage/
#   sudo cp deploy/nginx-app.conf /etc/nginx/sites-available/devnix-app.conf
#   sudo ln -s /etc/nginx/sites-available/devnix-app.conf /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/certbot -d app.devnixplus.com
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream devnix_app {
    server unix:/run/devnix/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.devnixplus.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://app.devnixplus.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                   # nginx < 1.25.1: "listen 443 ssl http2;" instead
    server_name app.devnixplus.com;

    ssl_certificate     /etc/letsencrypt/live/app.devnixplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.devnixplus.com/privkey.pem;

    client_max_body_size 8m;                    # photo uploads are limited to 5 MB by the app
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # collectstatic output (STATIC_ROOT)
    location /static/ { alias /var/www/devnix-static/; expires 30d; access_log off; }

    # uploaded photos (MEDIA_ROOT). Verification proof is never public: /manage/ streams it to the team.
    location /media/verification/ { deny all; }
    location /media/ { alias /var/www/devnix-media/; expires 7d; }

    # the editor's live preview loads the shared template assets from this host too
    location /_shared/ { alias /var/www/demos/_shared/; expires 30d; access_log off; }

    location / {
        proxy_pass http://devnix_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/javascript image/svg+xml;
}
