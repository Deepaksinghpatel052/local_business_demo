# =============================================================================
# www.businessbuider.devnixplus.com: the site builder AND the published sites on one domain.
#
#   /                 site builder (Docker container on 127.0.0.1:APP_DOCKER_PORT = 9002)
#   /static/          collectstatic output           <project>/var/static/
#   /media/           photos owners upload           <project>/media/uploads/   (verification/ is denied)
#   /_shared/         shared template assets         <project>/media/sites/_shared/
#   /sites/<slug>/    published websites             <project>/media/sites/<slug>/
#                     then the demo designs from git <project>/demos/<slug>/    (sample-salon, ...)
#
# Project folder: /var/www/html/clientDemoProjects/local_business_demo (MEDIA_DIR=./media).
# Matching .env: ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, APP_URL=https://www.businessbuider.devnixplus.com,
#   DEMO_BASE_URL=https://www.businessbuider.devnixplus.com/sites, SERVE_FILES=False, APP_DOCKER_PORT=9002
#
#   sudo cp deploy/nginx-businessbuider.conf /etc/nginx/sites-available/businessbuider.devnixplus.com
#   sudo chmod o+x /var/www/html/clientDemoProjects /var/www/html/clientDemoProjects/local_business_demo
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name businessbuider.devnixplus.com www.businessbuider.devnixplus.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.businessbuider.devnixplus.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name businessbuider.devnixplus.com;

    ssl_certificate /etc/letsencrypt/live/businessbuider.devnixplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/businessbuider.devnixplus.com/privkey.pem;

    return 301 https://www.businessbuider.devnixplus.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.businessbuider.devnixplus.com;

    ssl_certificate /etc/letsencrypt/live/businessbuider.devnixplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/businessbuider.devnixplus.com/privkey.pem;

    client_max_body_size 50m;

    access_log /var/log/nginx/businessbuider.access.log;
    error_log /var/log/nginx/businessbuider.error.log;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # CSS / JS (collectstatic output)
    location ^~ /static/ {
        alias /var/www/html/clientDemoProjects/local_business_demo/var/static/;
        expires 30d;
        access_log off;
    }

    # private verification files: never public
    location ^~ /media/verification/ {
        deny all;
    }

    # uploaded photos and template images
    location ^~ /media/ {
        alias /var/www/html/clientDemoProjects/local_business_demo/media/uploads/;
        expires 7d;
    }

    # shared assets used by every published site
    location ^~ /_shared/ {
        alias /var/www/html/clientDemoProjects/local_business_demo/media/sites/_shared/;
        expires 30d;
        access_log off;
    }

    # /sites/<slug>/ : published websites (media/sites) first, then the demo designs (demos/)
    location ^~ /sites/ {
        root /var/www/html/clientDemoProjects/local_business_demo/media;
        index index.html;
        try_files $uri $uri/ @demos;

        # /sites/slug -> /sites/slug/
        location ~ ^/sites/[a-z0-9-]+$ {
            return 301 $uri/;
        }

        # .tmp-* / .old-* publish folders, dotfiles
        location ~ /\. {
            deny all;
        }

        # changes on every save
        location ~ /data\.js$ {
            expires -1;
            try_files $uri @demos;
        }
    }

    # demo designs from git: /sites/sample-salon/ -> <project>/demos/sample-salon/
    location @demos {
        root /var/www/html/clientDemoProjects/local_business_demo;
        rewrite ^/sites/(.*)$ /demos/$1 break;
        try_files $uri ${uri}index.html =404;
    }

    # everything else: the site builder in Docker (port 9002)
    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
